# Tests und Builds für Linux und Windows.
# - Tests auf beiden Systemen (Qt ohne Bildschirm)
# - PyInstaller-Build je System, im gebauten Programm läuft `--selbsttest`
# - Kompatibilität: die Linux-Testdatenbank wird von den Tests auf Windows geöffnet,
#   eine unter Windows erzeugte Datenbank wird unter Linux geprüft
# - Bei einem Tag v*: GitHub-Release mit beiden Zip-Dateien
name: Tests und Builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Grundsatz: nur lesen. Schreiben darf allein der Job „release“ (siehe dort).
permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen
  PYTHON_VERSION: "3.13"

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Systempakete (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 poppler-utils
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests
        shell: bash
        run: |
          # Unter Windows findet Qt im Offscreen-Modus keine Schriften – dort die normale Anzeige verwenden
          if [ "$RUNNER_OS" = "Windows" ]; then export QT_QPA_PLATFORM=windows; fi
          python -m pytest -q

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Systempakete (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Programm bauen
        run: pyinstaller --noconfirm --windowed --name Notenverwaltung --paths src packaging/start.py
      - name: Selbsttest im gebauten Programm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $p = Start-Process -FilePath dist\Notenverwaltung\Notenverwaltung.exe -ArgumentList '--selbsttest' -Wait -PassThru
          Get-Content "$env:TEMP\notenverwaltung-selbsttest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Selbsttest im gebauten Programm (Linux)
        if: runner.os == 'Linux'
        run: dist/Notenverwaltung/Notenverwaltung --selbsttest
      - name: Kompatibilitätsdatei erzeugen
        run: python werkzeuge/kompatibilitaet.py erzeuge kompatibilitaet_${{ matrix.name }}.nvdb
      - name: Zip packen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\Notenverwaltung -DestinationPath Notenverwaltung-windows.zip
      - name: Zip packen (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -qr ../Notenverwaltung-linux.zip Notenverwaltung
      - uses: actions/upload-artifact@v4
        with:
          name: Notenverwaltung-${{ matrix.name }}
          path: Notenverwaltung-${{ matrix.name }}.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: kompatibilitaet-${{ matrix.name }}
          path: kompatibilitaet_${{ matrix.name }}.nvdb
          retention-days: 7

  gegenprobe:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pruefe: windows
          - os: windows-latest
            pruefe: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Systempakete (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: kompatibilitaet-${{ matrix.pruefe }}
      - name: Datenbank vom anderen System öffnen
        run: python werkzeuge/kompatibilitaet.py pruefe kompatibilitaet_${{ matrix.pruefe }}.nvdb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, gegenprobe]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # legt das Release an
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Notenverwaltung-*
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" Notenverwaltung-windows.zip Notenverwaltung-linux.zip \
            --repo "${GITHUB_REPOSITORY}" --title "Notenverwaltung ${GITHUB_REF_NAME}" \
            --notes "Windows: Zip entpacken, Notenverwaltung.exe starten. Linux: Zip entpacken, ./Notenverwaltung starten. Beide Fassungen öffnen dieselben Datenbankdateien."
